<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackout Map - Chennai Power Outage Reporter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;  /* FIXED: Changed from height: 100vh */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-y: auto;  /* FIXED: Changed from overflow: hidden */
            color: #ffffff;
            background: linear-gradient(135deg, rgba(0, 20, 60, 0.9), rgba(25, 25, 112, 0.8));
            position: relative;
        }
        .bg-map {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.illuminationphysics.com/wp-content/uploads/2021/10/Map-2021-2.jpg');
            background-size: cover; background-position: center;
            filter: brightness(0.4) sepia(0.3) hue-rotate(200deg) saturate(1.5);
            z-index: -2; opacity: 0.7;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(0, 20, 60, 0.8), rgba(25, 25, 112, 0.7));
            z-index: -1;
        }
        .content {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }
        .logo {
            font-size: 4rem; font-weight: 800;
            background: linear-gradient(45deg, #00bfff, #1e90ff);
            background-clip: text; -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 191, 255, 0.5);
        }
        .tagline { font-size: 1.5rem; margin-bottom: 30px; opacity: 0.9; }
        .stats {
            display: flex; gap: 30px; margin-bottom: 40px;
            flex-wrap: wrap; justify-content: center;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-number { font-size: 2.5rem; font-weight: bold; color: #00bfff; }
        .stat-label { font-size: 0.9rem; opacity: 0.8; }
        .button-group {
            display: flex; gap: 20px;
            flex-wrap: wrap; justify-content: center;
            margin-bottom: 40px;
        }
        .btn-report, .btn-map, .btn-admin {
            padding: 15px 40px; font-size: 1.2rem;
            font-weight: 600; border-radius: 50px;
            text-decoration: none; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease; border: none; display: inline-block;
        }
        .btn-map {
            background: linear-gradient(45deg, #00bfff, #1e90ff);
            color: white;
        }
        .btn-map:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 191, 255, 0.6);
            color: white;
        }
        .btn-admin {
            background: linear-gradient(45deg, #32cd32, #90ee90);
            color: white;
        }
        .btn-admin:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(50, 205, 50, 0.6);
            color: white;
        }
        .tech-badges {
            position: absolute; bottom: 30px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 15px;
        }
        .badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px; border-radius: 20px;
            font-size: 0.8rem; backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>
    <div class="bg-map"></div>
    <div class="overlay"></div>
    <div class="content">
        <div class="logo">
            <i class="fas fa-bolt me-3"></i>Blackout Map
        </div>
        <p class="tagline">Real-time Power Outage Reporting for Chennai</p>
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number">1,247</div>
                <div class="stat-label">Active Reports</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">89%</div>
                <div class="stat-label">Resolved</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">24h</div>
                <div class="stat-label">Avg Response</div>
            </div>
        </div>
        <div class="button-group">
            <a href="/map" class="btn-map">
                <i class="fas fa-map-marked-alt me-2"></i>View Live Map
            </a>
            <a href="/admin" class="btn-admin">
                <i class="fas fa-chart-bar me-2"></i>Admin Dashboard
            </a>
        </div>
        <div class="tech-badges">
            <span class="badge"><i class="fab fa-python me-1"></i>Flask</span>
            <span class="badge"><i class="fas fa-database me-1"></i>SQLite</span>
            <span class="badge"><i class="fab fa-google me-1"></i>Maps API</span>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
